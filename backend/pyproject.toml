[project]
name = "actionpilot"
version = "0.1.0"
description = "Meeting-to-Action agent: transcripts in, tasks, reminders and approved follow-up emails out"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.163.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=2.3.0",
    "numpy>=2.5.4",
    "openai>=3.51.0",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "pwdlib[argon2]>=0.4.0",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "rq>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
